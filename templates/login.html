{% extends "base.html" %}
{% block content %}
<div class="login-card">
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <input type="password" name="password" placeholder="Password" required autofocus>
        <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
</div>
{% endblock %}
